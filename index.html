<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Language Translation Tool</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <div class="logo">🌐</div>
            <h1>Language Translator</h1>
            <p>Break language barriers with instant translation.</p>
        </header>

        <main class="translator">

            <div class="language-row">

                <div class="language-box">
                    <label for="sourceLanguage">Translate From</label>

                    <select id="sourceLanguage">
                        <option value="en" selected>English</option>
                        <option value="hi">Hindi</option>
                        <option value="mr">Marathi</option>
                        <option value="fr">French</option>
                        <option value="es">Spanish</option>
                        <option value="de">German</option>
                        <option value="it">Italian</option>
                        <option value="pt">Portuguese</option>
                        <option value="ru">Russian</option>
                        <option value="ja">Japanese</option>
                        <option value="ko">Korean</option>
                        <option value="zh-CN">Chinese (Simplified)</option>
                        <option value="ar">Arabic</option>
                        <option value="bn">Bengali</option>
                        <option value="gu">Gujarati</option>
                        <option value="pa">Punjabi</option>
                        <option value="ta">Tamil</option>
                        <option value="te">Telugu</option>
                        <option value="ur">Urdu</option>
                    </select>
                </div>

                <button
                    type="button"
                    id="swapButton"
                    class="swap-button"
                    aria-label="Swap languages"
                    title="Swap languages">
                    ⇄
                </button>

                <div class="language-box">
                    <label for="targetLanguage">Translate To</label>

                    <select id="targetLanguage">
                        <option value="en">English</option>
                        <option value="hi" selected>Hindi</option>
                        <option value="mr">Marathi</option>
                        <option value="fr">French</option>
                        <option value="es">Spanish</option>
                        <option value="de">German</option>
                        <option value="it">Italian</option>
                        <option value="pt">Portuguese</option>
                        <option value="ru">Russian</option>
                        <option value="ja">Japanese</option>
                        <option value="ko">Korean</option>
                        <option value="zh-CN">Chinese (Simplified)</option>
                        <option value="ar">Arabic</option>
                        <option value="bn">Bengali</option>
                        <option value="gu">Gujarati</option>
                        <option value="pa">Punjabi</option>
                        <option value="ta">Tamil</option>
                        <option value="te">Telugu</option>
                        <option value="ur">Urdu</option>
                    </select>
                </div>

            </div>

            <div class="text-row">

                <div class="text-box">
                    <div class="box-heading">
                        <span>Your Text</span>
                        <span id="characterCount">0 / 500</span>
                    </div>

                    <textarea
                        id="inputText"
                        maxlength="500"
                        placeholder="Enter text you want to translate..."
                        aria-label="Text to translate"></textarea>

                    <div class="text-actions">
                        <button
                            type="button"
                            id="clearButton"
                            class="small-button">
                            🗑 Clear
                        </button>
                    </div>
                </div>

                <div class="text-box output-box">
                    <div class="box-heading">
                        <span>Translation</span>
                        <span id="outputLanguage">Hindi</span>
                    </div>

                    <div
                        id="outputText"
                        class="output-text"
                        role="status"
                        aria-live="polite">
                        Your translation will appear here...
                    </div>

                    <div class="text-actions">
                        <button
                            type="button"
                            id="copyButton"
                            class="small-button">
                            📋 Copy
                        </button>

                        <button
                            type="button"
                            id="speakButton"
                            class="small-button">
                            🔊 Listen
                        </button>
                    </div>
                </div>

            </div>

            <button
                type="button"
                id="translateButton"
                class="translate-button">
                <span>🌍</span> Translate Text
            </button>

            <p id="statusMessage" class="status-message" role="status"></p>

        </main>

        <footer>
            <p>Language Translation Tool | Built with HTML, CSS & JavaScript</p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
